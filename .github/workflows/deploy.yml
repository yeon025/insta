name: Deploy To EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Github Repository 코드 가져오기
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      # 2. JDK 17 설치
      - name: JDK 17버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Github Secrets의 내용을 application.yml로 생성
      - name: application.yml 파일 만들기
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application.yaml

      # 4. gradlew 실행 권한 부여
      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      # 5. Spring Boot 프로젝트 테스트 및 빌드
      - name: 테스트 및 빌드하기
        run: ./gradlew clean build

      # 6. Github Actions에서 AWS에 접근할 수 있도록 인증정보 설정
      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # 7. Github Actions에서 ECR 로그인
      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check Dockerfile
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f -name "Dockerfile"

      # 8. Docker 이미지 생성
      - name: Docker 이미지 생성
        run: docker build -t instagram-server .

      # 9. Docker 이미지에 ECR Repository 주소 Tag 붙이기
      - name: Docker 이미지에 Tag 붙이기
        run: docker tag instagram-server ${{ steps.login-ecr.outputs.registry }}/instagram-server:latest

      # 10. Docker 이미지를 ECR에 Push
      - name: ECR에 Docker 이미지 Push하기
        run: docker push ${{ steps.login-ecr.outputs.registry }}/insta:latest

      # 11. EC2에 SSH 접속하여 최신 Docker 이미지로 배포
      - name: SSH로 EC2에 접속하기
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            # 기존 컨테이너 중지
            docker stop instagram-server || true

            # 기존 컨테이너 삭제
            docker rm instagram-server || true

            # ECR에서 최신 Docker 이미지 다운로드
            docker pull ${{ steps.login-ecr.outputs.registry }}/instagram-server:latest

            # 최신 이미지로 새로운 컨테이너 실행
            docker run -d \
              --name instagram-server \
              -p 8080:8080 \
              ${{ steps.login-ecr.outputs.registry }}/instagram-server:latest